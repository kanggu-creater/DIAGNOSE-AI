async function loadGeminiKey(){
  try{

// ── Firebase DB (진단평가 전용 경로: diagnostics / diagResults) ──
const DB={
  async getA(uid){
    try{
      const r=await fetch(`${FIREBASE_URL}/diagnostics/${uid}.json`);
      const d=await r.json();
      if(!d)return[];
      return Object.values(d).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
    }catch{return[];}
  },
  async setA(uid, arr){
    const obj={};arr.forEach(a=>{obj[a.id]=a;});
    await fetch(`${FIREBASE_URL}/diagnostics/${uid}.json`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(obj)});
  },
  async findAssessment(asmId){
    try{
      const r=await fetch(`${FIREBASE_URL}/diagnostics.json`);
      const d=await r.json();
      if(!d)return null;
      for(const uid of Object.keys(d)){
        if(d[uid][asmId])return {...d[uid][asmId], _ownerUid:uid};
      }
      return null;
    }catch{return null;}
  },
  async getR(uid, id){
    try{
      const r=await fetch(`${FIREBASE_URL}/diagResults/${uid}/${id}.json`);
      const d=await r.json();
      if(!d)return[];
      return Object.values(d);
    }catch{return[];}
  },
  async setROne(uid, id, studentData){
    const key=studentData.studentId.replace(/[.#$/[\]\s]/g,"_");
    const res=await fetch(`${FIREBASE_URL}/diagResults/${uid}/${id}/${key}.json`,{
      method:"PUT",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(studentData)
    });
    if(!res.ok)throw new Error(`저장 실패: ${res.status}`);
    return await res.json();
  },
};

async function askAI(msgs,sys,maxTokens=1200){
  const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${CFG.apiKey}`,{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({system_instruction:{parts:[{text:sys}]},contents:msgs,generationConfig:{maxOutputTokens:maxTokens,temperature:0,thinkingConfig:{thinkingBudget:0}}}),
  });
  const d=await res.json();
  if(d.error)throw new Error(d.error.message);
  return d.candidates[0].content.parts.filter(p=>p.text).map(p=>p.text).join("");
}
function extractJSON(raw){
  const cleaned=raw.replace(/```json|```/g,"").trim();
  const objM=cleaned.match(/\{[\s\S]*\}/);
  const arrM=cleaned.match(/\[[\s\S]*\]/);
  const pick = arrM && (!objM || arrM.index<=objM.index) ? arrM : objM;
  return pick?JSON.parse(pick[0]):null;
}

function QRImage({url}){
  const ref=useRef(null);
  useEffect(()=>{
    if(!url||!ref.current)return;
    ref.current.innerHTML="";
    const gen=()=>new window.QRCode(ref.current,{text:url,width:256,height:256,correctLevel:window.QRCode.CorrectLevel.M});
    window.QRCode?gen():(()=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";s.onload=gen;document.head.appendChild(s);})();
  },[url]);
  return <div ref={ref} style={{lineHeight:0}}/>;
}
function Empty({icon,text}){return<div style={{textAlign:"center",padding:56,color:"#94A3B8"}}><div style={{fontSize:36,marginBottom:12}}>{icon}</div><div style={{fontSize:14}}>{text}</div></div>;}
function Center({children}){return<div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",background:"#F1F5F9"}}>{children}</div>;}
function LevelBadge({level,small,label}){const c=LV[level]||LV["미응답"];return<span style={{background:c.bg,color:c.fg,border:`1px solid ${c.bd}`,borderRadius:20,padding:small?"1px 8px":"3px 11px",fontWeight:700,fontSize:small?11:12,whiteSpace:"nowrap"}}>{label||level}</span>;}

function App(){
  const [mode,setMode]=useState("loading");
  const [sAsmId,setSAsmId]=useState(null);
  const [sOwnerUid,setSOwnerUid]=useState(null);
  const [user,setUser]=useState(null);

  useEffect(()=>{
    const init=async()=>{
      await loadGeminiKey();
      const params=new URLSearchParams(window.location.search);
      const sid=params.get("id");
      const code=params.get("code");
      if(sid){
        const asm=await DB.findAssessment(sid);
        if(asm){setSAsmId(sid);setSOwnerUid(asm._ownerUid);setMode("student");return;}
      }
      if(code){
        try{
          const r=await fetch(`${FIREBASE_URL}/diagnostics.json`);
          const d=await r.json();
          if(d){
            for(const uid of Object.keys(d)){
              for(const aid of Object.keys(d[uid])){
                if(shortCode(aid)===code.toUpperCase()){setSAsmId(aid);setSOwnerUid(uid);setMode("student");return;}
              }
            }
          }
        }catch{}
      }
      let waited=0;
      while((typeof firebase==="undefined"||!firebase.auth)&&waited<8000){await new Promise(r=>setTimeout(r,100));waited+=100;}
      if(typeof firebase!=="undefined"&&firebase.auth){
        firebase.auth().onAuthStateChanged(u=>{setUser(u);setMode(u?"teacher":"login");});
      }else{setMode("login");}
    };
    init();
  },[]);

  if(mode==="loading")return<Center><div style={{color:"#94A3B8"}}>로딩 중...</div></Center>;
  if(mode==="student")return<StudentPage asmId={sAsmId} ownerUid={sOwnerUid}/>;
  if(mode==="login")return<LoginPage/>;
  return<TeacherApp user={user}/>;
}

  const addQ=()=>setForm(p=>({...p,questions:[...p.questions,emptyQ()]}));
  const delQ=qid=>setForm(p=>({...p,questions:p.questions.length>1?p.questions.filter(q=>q.id!==qid):p.questions}));

[★ 기준 교육과정 - 반드시 준수 ★]

형식: [{"text":"...","concept":"...","choices":["...","...","...","..."],"correct":0}]`;
      const raw=await askAI([{role:"user",parts:[{text:`새로 배울 단원: ${genTopic}\n'${curName}'을 기준으로, 이 단원의 선수학습 내용을 진단하는 문제를 만들어 주세요.`}]}],sys,2800);

      if(!Array.isArray(arr)||!arr.length)throw new Error("생성 결과를 해석하지 못했습니다.");
      setForm(p=>({...p,questions:arr.map(q=>{
        const choices=Array.isArray(q.choices)&&q.choices.length?q.choices.map(String):["","","",""];
        let correct=parseInt(q.correct);if(isNaN(correct)||correct<0||correct>=choices.length)correct=0;
        return{id:Date.now().toString()+Math.random().toString(36).slice(2,6),type:"choice",text:q.text||"",concept:q.concept||"",choices,correct,answer:""};
      })}));
    }catch(e){alert("문제 생성 실패: "+e.message);}
    setGen(false);
  };

  const submit=async()=>{
    const qs=form.questions.filter(q=>q.text.trim());
    if(!form.title.trim())return alert("평가 제목을 입력해주세요.");
    if(!qs.length)return alert("문제를 1개 이상 입력해주세요.");
    for(let i=0;i<qs.length;i++){
      const q=qs[i];
      if((q.type||"choice")==="choice"){
        const filled=(q.choices||[]).map(c=>c.trim());
        if(filled.filter(c=>c).length<2)return alert(`문제 ${i+1}: 선택지를 2개 이상 입력해주세요.`);
        if(!filled[q.correct])return alert(`문제 ${i+1}: 정답으로 선택한 항목이 비어 있습니다.`);
      }
    }
    // 객관식은 빈 선택지 제거(정답 인덱스 보정)
    const cleanQs=qs.map(q=>{
      if((q.type||"choice")!=="choice")return q;
      const correctText=(q.choices||[])[q.correct];
      const choices=(q.choices||[]).map(c=>c.trim()).filter(c=>c);
      const correct=Math.max(0,choices.indexOf((correctText||"").trim()));
      return{...q,choices,correct};
    });
    const cleanForm={...form,questions:cleanQs};
    const next=editId?asms.map(a=>a.id===editId?{...a,...cleanForm}:a):[{...cleanForm,id:Date.now().toString(),createdAt:new Date().toISOString()},...asms];
    await onSave(next);setForm(empty);setEditId(null);setFlash(true);setTimeout(()=>setFlash(false),2000);window.scrollTo({top:0,behavior:"smooth"});
  };
  const del=async id=>{if(!confirm("삭제하시겠습니까?"))return;await onSave(asms.filter(a=>a.id!==id));};
  const edit=a=>{setForm({title:a.title,subject:a.subject,school:a.school||"중학교",grade:a.grade,cls:a.cls,questions:(a.questions||[]).map(q=>({...q,choices:[...(q.choices||["","","",""])]}))});setEditId(a.id);window.scrollTo({top:0,behavior:"smooth"});};
  const copy=a=>{setForm({title:a.title,subject:a.subject,school:a.school||"중학교",grade:a.grade,cls:"",questions:(a.questions||[]).map(q=>({...q,choices:[...(q.choices||["","","",""])],id:Date.now().toString()+Math.random().toString(36).slice(2,6)}))});setEditId(null);window.scrollTo({top:0,behavior:"smooth"});};

  return(
    <div>
      <div style={{background:"white",borderRadius:14,padding:24,boxShadow:"0 1px 4px rgba(0,0,0,0.07)",marginBottom:20}}>
        <h2 style={{margin:"0 0 18px",fontSize:16,fontWeight:700,color:DK}}>{editId?"✏️ 수정":"✨ 새 진단평가 출제"}</h2>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
          {[["평가 제목 *","title","예: 3학년 – 세포 단원 진단"],["수업/단원 주제","subject","예: 세포의 구조"]].map(([l,k,p])=>(<div key={k}><label style={{fontSize:13,fontWeight:600,color:"#475569",display:"block",marginBottom:5}}>{l}</label><input style={inp} placeholder={p} value={form[k]} onChange={f(k)}/></div>))}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1.2fr 1fr 1fr",gap:12,marginBottom:12}}>
          <div><label style={{fontSize:13,fontWeight:600,color:"#475569",display:"block",marginBottom:5}}>학교급</label>
            <select style={inp} value={form.school} onChange={f("school")}>{["초등학교","중학교","고등학교"].map(s=><option key={s} value={s}>{s}</option>)}</select>
          </div>
          <div><label style={{fontSize:13,fontWeight:600,color:"#475569",display:"block",marginBottom:5}}>학년</label><input style={inp} placeholder="예: 3" value={form.grade} onChange={f("grade")}/></div>
          <div><label style={{fontSize:13,fontWeight:600,color:"#475569",display:"block",marginBottom:5}}>반</label><input style={inp} placeholder="예: 2" value={form.cls} onChange={f("cls")}/></div>
        </div>

        {/* AI 문제 생성 */}
        <div style={{background:"#EFF6FF",borderRadius:10,padding:14,marginBottom:16,border:"1px solid #DBEAFE"}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4,flexWrap:"wrap"}}>
            <div style={{fontSize:13,fontWeight:700,color:BL}}>🤖 AI 선수학습 진단 문제 자동 생성</div>
            <span style={{fontSize:10,fontWeight:700,background:resolvedCurriculum==="2022"?"#DBEAFE":"#FEF3C7",color:resolvedCurriculum==="2022"?BL:"#92400E",borderRadius:12,padding:"2px 8px"}}>{resolvedCurriculum} 개정 교육과정 기준</span>
          </div>
          <div style={{fontSize:11,color:"#3B82F6",marginBottom:8,lineHeight:1.6}}>새로 배울 단원을 입력하면, 해당 교육과정의 계열성에 따라 그 단원을 배우기 전에 알아야 할 <b>이전 학습 내용</b>을 진단하는 객관식 문제를 만듭니다.</div>

          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8,flexWrap:"wrap"}}>
            <span style={{fontSize:12,fontWeight:600,color:"#475569"}}>교육과정 기준</span>
            <select value={curMode} onChange={e=>setCurMode(e.target.value)} style={{...inp,width:170,padding:"7px 10px"}}>
              <option value="auto">자동 (학년 기준)</option>
              <option value="2022">2022 개정</option>
              <option value="2015">2015 개정</option>
            </select>
            {curMode==="auto"&&<span style={{fontSize:11,color:"#64748B"}}>
              {gradeNum?<>→ <b style={{color:resolvedCurriculum==="2022"?BL:"#92400E"}}>{resolvedCurriculum} 개정</b> ({form.school} {gradeNum}학년 · {curYear}년 기준)</>:"→ 학년을 입력하면 자동 판별됩니다"}
            </span>}
          </div>

          <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
            <input style={{...inp,flex:1,minWidth:200}} placeholder="새로 배울 단원 (예: 중2 마찰전기)" value={genTopic} onChange={e=>setGenTopic(e.target.value)} onKeyDown={e=>e.key==="Enter"&&!gen&&generate()}/>
            <select value={genN} onChange={e=>setGenN(Number(e.target.value))} style={{...inp,width:90}}>{[3,4,5,6,8,10].map(n=><option key={n} value={n}>{n}문제</option>)}</select>
            <button onClick={generate} disabled={gen} style={btn(gen?"#94A3B8":BL,undefined,{whiteSpace:"nowrap",cursor:gen?"not-allowed":"pointer"})}>{gen?"생성 중...":"생성"}</button>
          </div>
          <div style={{fontSize:11,color:"#64748B",marginTop:6}}>* 자동 모드는 학교급·학년과 현재 연도로 적용 교육과정을 판별합니다 (중1 2025 · 중2 2026 · 중3 2027부터 2022 개정 적용).</div>
        </div>

        {/* 문제 목록 */}
        <label style={{fontSize:13,fontWeight:600,color:"#475569",display:"block",marginBottom:8}}>진단 문제 * <span style={{fontWeight:400,color:"#94A3B8"}}>— AI가 이 문제로 학생 답변을 진단합니다</span></label>
        {form.questions.map((q,i)=>{const qtype=q.type||"choice";return(
          <div key={q.id} style={{border:"1px solid #E2E8F0",borderRadius:10,padding:14,marginBottom:10}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{fontWeight:700,fontSize:13,color:BL}}>문제 {i+1}</span>
                <div style={{display:"flex",gap:4}}>
                  {[["choice","객관식"],["short","서술형"]].map(([tv,tl])=>(
                    <button key={tv} onClick={()=>setQ(q.id,"type",tv)} style={{padding:"3px 10px",borderRadius:6,fontSize:11,fontWeight:700,cursor:"pointer",border:qtype===tv?`1px solid ${BL}`:"1px solid #E2E8F0",background:qtype===tv?"#EFF6FF":"white",color:qtype===tv?BL:"#64748B"}}>{tl}</button>
                  ))}
                </div>
              </div>
              <button onClick={()=>delQ(q.id)} style={btn("#FEF2F2","#DC2626",{border:"1px solid #FCA5A5",fontSize:11,padding:"4px 10px"})}>삭제</button>
            </div>
            <textarea style={{...inp,height:60,resize:"vertical",marginBottom:8}} placeholder="문제 내용을 입력하세요" value={q.text} onChange={e=>setQ(q.id,"text",e.target.value)}/>
            <input style={{...inp,marginBottom:8}} placeholder="진단하는 선수학습 개념 (예: 물질의 구성)" value={q.concept} onChange={e=>setQ(q.id,"concept",e.target.value)}/>
            {qtype==="choice"?(
              <div>
                <div style={{fontSize:12,color:"#64748B",marginBottom:6}}>선택지 <span style={{color:"#94A3B8"}}>— 왼쪽 ○를 눌러 정답 표시</span></div>
                {(q.choices||[]).map((c,ci)=>(
                  <div key={ci} style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
                    <button onClick={()=>setQ(q.id,"correct",ci)} title="정답으로 지정" style={{width:26,height:26,borderRadius:"50%",flexShrink:0,cursor:"pointer",border:q.correct===ci?`2px solid #16A34A`:"2px solid #CBD5E1",background:q.correct===ci?"#16A34A":"white",color:"white",fontWeight:900,fontSize:13,display:"flex",alignItems:"center",justifyContent:"center"}}>{q.correct===ci?"✓":""}</button>
                    <input style={{...inp,background:q.correct===ci?"#F0FDF4":"white"}} placeholder={`선택지 ${ci+1}`} value={c} onChange={e=>setChoice(q.id,ci,e.target.value)}/>
                    {(q.choices||[]).length>2&&<button onClick={()=>delChoice(q.id,ci)} style={{width:26,height:26,flexShrink:0,borderRadius:6,border:"1px solid #E2E8F0",background:"white",color:"#94A3B8",cursor:"pointer",fontSize:14}}>×</button>}
                  </div>
                ))}
                {(q.choices||[]).length<6&&<button onClick={()=>addChoice(q.id)} style={btn("#F8FAFC",BL,{border:"1px dashed #93C5FD",fontSize:12,padding:"6px 12px",marginTop:2})}>＋ 선택지 추가</button>}
              </div>
            ):(
              <input style={inp} placeholder="모범답안 / 채점 핵심 (AI가 이 기준으로 서술형 답변을 진단)" value={q.answer} onChange={e=>setQ(q.id,"answer",e.target.value)}/>
            )}
          </div>
        );})}
        <button onClick={addQ} style={btn("#F8FAFC",BL,{border:"1px dashed #93C5FD",width:"100%",marginBottom:16})}>＋ 문제 추가</button>

        <div style={{display:"flex",justifyContent:"flex-end",gap:8}}>
          {editId&&<button onClick={()=>{setEditId(null);setForm(empty);}} style={btn("white","#64748B",{border:"1px solid #E2E8F0"})}>취소</button>}
          <button onClick={submit} style={btn(flash?"#10B981":BL)}>{flash?"✓ 저장됨!":editId?"수정 완료":"저장하기"}</button>
        </div>
      </div>

      {asms.length>0&&<div>
        <h3 style={{fontSize:14,fontWeight:700,color:DK,marginBottom:10}}>저장된 진단평가 ({asms.length}개)</h3>
        {asms.map(a=>(<div key={a.id} style={{background:"white",borderRadius:10,padding:"12px 16px",marginBottom:8,boxShadow:"0 1px 3px rgba(0,0,0,0.06)",display:"flex",alignItems:"center",justifyContent:"space-between",gap:12}}>
          <div style={{flex:1}}><div style={{fontWeight:700,fontSize:14,color:DK,marginBottom:2}}>{a.title}</div><div style={{fontSize:12,color:"#64748B"}}>{a.subject&&`📚 ${a.subject}  `}{a.school&&`${a.school} `}{a.grade&&`${a.grade}학년 `}{a.cls&&`${a.cls}반  `}• 문제 {(a.questions||[]).length}개</div></div>
          <div style={{display:"flex",gap:6}}>
            <button onClick={()=>edit(a)} style={btn("white",BL,{border:`1px solid ${BL}`,fontSize:12,padding:"6px 12px"})}>수정</button>
            <button onClick={()=>copy(a)} style={btn("#F0FDF4","#15803D",{border:"1px solid #86EFAC",fontSize:12,padding:"6px 12px"})}>📋 복사</button>
            <button onClick={()=>del(a.id)} style={btn("#FEF2F2","#DC2626",{border:"1px solid #FCA5A5",fontSize:12,padding:"6px 12px"})}>삭제</button>
          </div>
        </div>))}
      </div>}
    </div>
  );
}

// ── QR 탭 ─────────────────────────────────────────────────
function QRTab({asms}){
  const [selId,setSelId]=useState(null);
  const sel=asms.find(a=>a.id===selId);
  const base=window.location.href.split(/[#?]/)[0];
  const stuUrl=selId?`${base}?id=${selId}`:"";
  return(
    <div>
      <p style={{color:"#64748B",fontSize:14,marginTop:0,marginBottom:16}}>진단평가를 클릭하면 QR코드가 바로 생성됩니다.</p>
      {asms.length===0?<Empty icon="📝" text="먼저 출제 탭에서 진단평가를 생성해주세요."/>:(
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(190px,1fr))",gap:10,marginBottom:24}}>
          {asms.map(a=>(<div key={a.id} onClick={()=>setSelId(a.id)} style={{background:"white",borderRadius:12,padding:16,cursor:"pointer",border:selId===a.id?`2px solid ${BL}`:"2px solid transparent",boxShadow:"0 1px 4px rgba(0,0,0,0.07)",transition:"all 0.15s"}}>
            <div style={{fontSize:26,marginBottom:8}}>🩺</div>
            <div style={{fontWeight:700,fontSize:13,color:DK,marginBottom:3,lineHeight:1.4}}>{a.title}</div>
            <div style={{fontSize:11,color:"#94A3B8",marginBottom:6}}>{a.grade&&`${a.grade}학년 `}{a.cls&&`${a.cls}반`} · 문제 {(a.questions||[]).length}개</div>
            <div style={{fontSize:11,background:"#EFF6FF",color:BL,borderRadius:5,padding:"2px 7px",display:"inline-block",fontWeight:700,letterSpacing:1}}>#{shortCode(a.id)}</div>
          </div>))}
        </div>
      )}
      {sel&&(
        <div style={{background:"white",borderRadius:14,padding:28,boxShadow:"0 1px 4px rgba(0,0,0,0.07)",display:"flex",flexDirection:"column",alignItems:"center"}}>
          <h3 style={{margin:"0 0 4px",fontSize:17,fontWeight:700,color:DK}}>{sel.title}</h3>
          {sel.subject&&<p style={{color:"#64748B",fontSize:13,margin:"0 0 4px"}}>📚 {sel.subject}</p>}
          <p style={{color:"#94A3B8",fontSize:12,margin:"0 0 20px"}}>QR코드를 학생들에게 보여주세요</p>
          <div style={{padding:10,border:"1px solid #E2E8F0",borderRadius:10,background:"white"}}><QRImage url={stuUrl}/></div>
          <div style={{marginTop:16,background:"#EFF6FF",borderRadius:10,padding:"12px 24px",textAlign:"center"}}>
            <div style={{fontSize:11,color:"#64748B",marginBottom:3}}>QR이 안 될 경우 — 학생 입장 코드</div>
            <div style={{fontSize:26,fontWeight:900,color:BL,letterSpacing:4}}>#{shortCode(sel.id)}</div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── 진단결과 탭 ────────────────────────────────────────────
function ResultsTab({asms, uid}){
  const [selId,setSelId]=useState("");
  const [results,setResults]=useState([]);
  const [expand,setExpand]=useState({});
  useEffect(()=>{if(!selId)return;const load=()=>DB.getR(uid, selId).then(setResults);load();const iv=setInterval(load,4000);return()=>clearInterval(iv);},[selId, uid]);
  const asm=asms.find(a=>a.id===selId);
  const questions=asm?.questions||[];
  const sorted=[...results].sort((a,b)=>a.studentId.localeCompare(b.studentId));

  // 개념별 취약점 집계
  const answered=a=>a&&(a.selected!=null||(a.response&&a.response.trim()));
  const conceptStats=questions.map((q,qi)=>{
    const c={도달:0,부분도달:0,미도달:0,미응답:0};
    sorted.forEach(r=>{
      const a=(r.answers||[]).find(x=>x.questionId===q.id);
      if(!answered(a))c.미응답++;
      else c[a.level]=(c[a.level]||0)+1;
    });
    return {q,qi,c,total:sorted.length};
  });

  const download=()=>{
    if(!asm)return;
    // 시트1: 학생별 요약 (wide)
    const wide=sorted.map(r=>{
      const row={"학번":r.studentId,"평균이해도":Math.round(r.avgScore||0)+"%","제출":r.submitted?"제출":"진행중"};
      questions.forEach((q,i)=>{const a=(r.answers||[]).find(x=>x.questionId===q.id);row[`Q${i+1}`]=a?a.level:"미응답";});
      return row;
    });
    // 시트2: 상세 (long)
    const long=[];
    sorted.forEach(r=>{
      questions.forEach((q,i)=>{
        const a=(r.answers||[]).find(x=>x.questionId===q.id);
        const isChoice=(q.type||"choice")==="choice";
        const oX=isChoice&&a&&a.selected!=null?(a.selected===q.correct?"O":"X"):"";
        long.push({"학번":r.studentId,"문제번호":`Q${i+1}`,"유형":isChoice?"객관식":"서술형","진단개념":q.concept||"","문제":q.text,"학생답변":a?.response||"","정오":oX,"진단수준":a?.level||"미응답","이해도":a?a.score+"%":"","진단":a?.diagnosis||"","해설":a?.explanation||""});
      });
    });
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(wide),"학생별요약");
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(long),"상세진단");
    XLSX.writeFile(wb,`${asm.title}_진단결과.xlsx`);
  };

  const toggle=k=>setExpand(p=>({...p,[k]:!p[k]}));

  return(
    <div>
      <div style={{display:"flex",gap:10,marginBottom:18,alignItems:"center",flexWrap:"wrap"}}>
        <select value={selId} onChange={e=>{setSelId(e.target.value);setExpand({});}} style={{flex:1,minWidth:200,padding:"10px 12px",border:"1px solid #E2E8F0",borderRadius:8,fontSize:13,outline:"none"}}>
          <option value="">📋 진단평가를 선택하세요</option>
          {asms.map(a=><option key={a.id} value={a.id}>{a.title}</option>)}
        </select>
        {selId&&<div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:11,color:"#94A3B8"}}>● 4초마다 자동갱신</span>
          <button onClick={download} style={btn("#059669",undefined,{fontSize:13,padding:"9px 16px",whiteSpace:"nowrap"})}>⬇ 엑셀 다운로드</button>
        </div>}
      </div>

      {selId&&sorted.length===0&&<Empty icon="⏳" text="아직 참여한 학생이 없습니다."/>}

      {/* 개념별 취약점 분석 */}
      {selId&&sorted.length>0&&(
        <div style={{background:"white",borderRadius:14,padding:20,boxShadow:"0 1px 4px rgba(0,0,0,0.07)",marginBottom:16}}>
          <h3 style={{fontSize:14,fontWeight:800,color:DK,margin:"0 0 14px"}}>🔍 개념별 진단 분석 <span style={{fontWeight:400,color:"#94A3B8",fontSize:12}}>(참여 {sorted.length}명)</span></h3>
          {conceptStats.map(({q,qi,c,total})=>{
            const pct=v=>total?Math.round(v/total*100):0;
            return(
              <div key={q.id} style={{marginBottom:14}}>
                <div style={{fontSize:13,fontWeight:600,color:DK,marginBottom:5}}>Q{qi+1}. {q.concept||q.text.slice(0,30)}</div>
                <div style={{display:"flex",height:24,borderRadius:6,overflow:"hidden",fontSize:11,fontWeight:700}}>
                  {["도달","부분도달","미도달","미응답"].map(lv=>c[lv]>0&&(
                    <div key={lv} title={`${lv} ${c[lv]}명`} style={{width:`${pct(c[lv])}%`,background:LV[lv].bg,color:LV[lv].fg,display:"flex",alignItems:"center",justifyContent:"center",minWidth:c[lv]>0?26:0}}>{c[lv]}</div>
                  ))}
                </div>
                {c["미도달"]/total>=0.4&&<div style={{fontSize:11,color:"#B91C1C",marginTop:4,fontWeight:600}}>⚠️ 미도달 비율이 높습니다 — 재지도 권장</div>}
              </div>
            );
          })}
          <div style={{display:"flex",gap:12,marginTop:10,flexWrap:"wrap"}}>
            {["도달","부분도달","미도달","미응답"].map(lv=><div key={lv} style={{display:"flex",alignItems:"center",gap:5,fontSize:11,color:"#64748B"}}><span style={{width:12,height:12,borderRadius:3,background:LV[lv].bg,border:`1px solid ${LV[lv].bd}`}}/>{lv}</div>)}
          </div>
        </div>
      )}

      {/* 학생별 결과 */}
      {sorted.length>0&&(
        <div style={{background:"white",borderRadius:14,overflow:"auto",boxShadow:"0 1px 4px rgba(0,0,0,0.07)"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
            <thead><tr style={{background:"#F8FAFC"}}>
              <th style={{padding:"11px 13px",textAlign:"left",fontWeight:600,color:"#475569",borderBottom:"1px solid #E2E8F0",whiteSpace:"nowrap"}}>학번</th>
              <th style={{padding:"11px 13px",textAlign:"center",fontWeight:600,color:"#475569",borderBottom:"1px solid #E2E8F0",whiteSpace:"nowrap"}}>평균이해도</th>
              {questions.map((q,i)=><th key={q.id} style={{padding:"11px 8px",textAlign:"center",fontWeight:600,color:"#475569",borderBottom:"1px solid #E2E8F0",whiteSpace:"nowrap"}}>Q{i+1}</th>)}
              <th style={{padding:"11px 13px",textAlign:"center",fontWeight:600,color:"#475569",borderBottom:"1px solid #E2E8F0"}}></th>
            </tr></thead>
            <tbody>
              {sorted.map((r,ri)=>{
                const open=expand[r.studentId];
                return(<React.Fragment key={r.studentId}>
                  <tr style={{borderBottom:open?"none":"1px solid #E2E8F0",background:ri%2===0?"white":"#FAFBFC"}}>
                    <td style={{padding:"12px 13px",fontWeight:700,color:DK,whiteSpace:"nowrap"}}>{r.studentId}</td>
                    <td style={{padding:"12px 13px",textAlign:"center"}}>{r.submitted?<span style={{background:"#DBEAFE",color:BL,padding:"3px 10px",borderRadius:20,fontWeight:700}}>{Math.round(r.avgScore||0)}%</span>:<span style={{color:"#94A3B8",fontSize:12}}>진행중</span>}</td>
                    {questions.map(q=>{const a=(r.answers||[]).find(x=>x.questionId===q.id);const lv=answered(a)?a.level:"미응답";return<td key={q.id} style={{padding:"10px 6px",textAlign:"center"}}><LevelBadge level={lv} small/></td>;})}
                    <td style={{padding:"12px 13px",textAlign:"center"}}><button onClick={()=>toggle(r.studentId)} style={{fontSize:11,color:BL,background:"none",border:"none",cursor:"pointer",fontWeight:600,whiteSpace:"nowrap"}}>{open?"▲ 접기":"▼ 상세"}</button></td>
                  </tr>
                  {open&&(
                    <tr style={{borderBottom:"1px solid #E2E8F0",background:"#F8FAFC"}}>
                      <td colSpan={questions.length+3} style={{padding:"6px 16px 16px"}}>
                        {questions.map((q,i)=>{const a=(r.answers||[]).find(x=>x.questionId===q.id);return(
                          <div key={q.id} style={{background:"white",borderRadius:8,padding:12,marginTop:8,border:"1px solid #E2E8F0"}}>
                            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,marginBottom:6}}>
                              <span style={{fontWeight:700,fontSize:12,color:DK}}>Q{i+1}. {q.text}</span>
                              <LevelBadge level={answered(a)?a.level:"미응답"} small/>
                            </div>
                            <div style={{fontSize:12,color:"#334155",marginBottom:4}}><b style={{color:BL}}>답변:</b> {a?.response||<span style={{color:"#CBD5E1"}}>미응답</span>}</div>
                            {a?.diagnosis&&<div style={{fontSize:12,color:"#475569",background:"#F8FAFC",borderRadius:6,padding:"6px 9px"}}>🩺 {a.diagnosis}</div>}
                          </div>
                        );})}
                      </td>
                    </tr>
                  )}
                </React.Fragment>);
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function StudentEnterTab({asms}){
  const [code,setCode]=useState("");const [err,setErr]=useState("");
  const enter=()=>{
    const c=code.replace("#","").trim().toUpperCase();
    if(!c)return;
    const found=asms.find(a=>shortCode(a.id)===c);
    if(!found){setErr("코드를 찾을 수 없습니다.");return;}
    window.location.search=`?id=${found.id}`;
  };
  return(
    <div style={{maxWidth:380,margin:"50px auto",textAlign:"center"}}>
      <div style={{fontSize:44,marginBottom:12}}>🎓</div>
      <h2 style={{margin:"0 0 6px",fontSize:20,fontWeight:800,color:DK}}>학생 입장</h2>
      <p style={{color:"#64748B",fontSize:13,margin:"0 0 28px"}}>선생님이 알려주신 입장 코드를 입력하세요</p>
      <input value={code} onChange={e=>{setCode(e.target.value.toUpperCase());setErr("");}} onKeyDown={e=>e.key==="Enter"&&enter()} placeholder="A3F2B1" maxLength={6}
        style={{...inp,fontSize:26,textAlign:"center",fontWeight:900,letterSpacing:5,padding:"14px",borderRadius:10,borderColor:err?"#FCA5A5":"#E2E8F0"}}/>
      {err&&<div style={{color:"#DC2626",fontSize:12,marginTop:6}}>{err}</div>}
      <button onClick={enter} style={btn(BL,undefined,{width:"100%",padding:"13px",fontSize:15,marginTop:12,borderRadius:10})}>입장하기</button>
    </div>
  );
}

// ══════════════════════════════════════════════════════════
// 학생 페이지 (진단평가 진행)
// ══════════════════════════════════════════════════════════
function StudentPage({asmId, ownerUid}){
  const [asm,setAsm]=useState(null);const [ready,setReady]=useState(false);
  const [sid,setSid]=useState("");const [confirmed,setConfirmed]=useState("");
  const [idx,setIdx]=useState(0);
  const [answers,setAnswers]=useState([]); // [{questionId, response, level, score, diagnosis, explanation}]
  const [input,setInput]=useState("");
  const [selected,setSelected]=useState(null);
  const [loading,setLoading]=useState(false);
  const [phase,setPhase]=useState("intro"); // intro | answering | done
  const [saveStatus,setSaveStatus]=useState("");
  const [lang,setLang]=useState("ko");
  const [qTrans,setQTrans]=useState({});   // {questionId:{text,concept,choices}}
  const [transReady,setTransReady]=useState(false);

  const questions=asm?.questions||[];
  const t=T[lang]||T.ko;
  const mc=k=>(MC[k]&&(MC[k][lang]||MC[k].ko))||"";
  const qText=q=>(qTrans[q.id]&&qTrans[q.id].text)||q.text;
  const qConcept=q=>(qTrans[q.id]&&qTrans[q.id].concept)||q.concept;
  const qChoices=q=>{const tr=qTrans[q.id]&&qTrans[q.id].choices;const orig=q.choices||[];return(Array.isArray(tr)&&tr.length===orig.length&&orig.length)?tr:orig;};

  useEffect(()=>{DB.findAssessment(asmId).then(a=>{setAsm(a);setReady(true);});},[asmId]);
  useEffect(()=>{
    if(!confirmed||!asmId||!ownerUid)return;
    DB.getR(ownerUid, asmId).then(results=>{
      const ex=results.find(r=>r.studentId===confirmed);
      if(ex){
        setAnswers(ex.answers||[]);
        if(ex.submitted){setPhase("done");}
        else{setIdx(Math.min((ex.answers||[]).length,(asm?.questions||[]).length-1));setPhase("answering");}
      }else{setPhase("answering");}
    });
  },[confirmed,asmId,ownerUid]);

  // 학생이 언어 선택 후 입장하면 문제를 해당 언어로 1회 배치 번역
  useEffect(()=>{
    if(!confirmed||!asm)return;
    const qs=asm.questions||[];
    if(lang==="ko"||!qs.length){setTransReady(true);return;}
    let alive=true;
    setTransReady(false);
    (async()=>{
      try{
        const sys=`다음 진단평가 문제들을 ${t.aiLang}(으)로 자연스럽고 정확하게 번역하세요. 전문 용어/과학 개념은 해당 언어의 표준 용어로 번역합니다. 각 항목의 id는 그대로 두고 text, concept, choices를 번역하세요. choices는 순서와 개수를 절대 바꾸지 말고 각 항목을 그 자리에서 번역만 하세요. 반드시 JSON 배열만 출력하고 다른 텍스트는 쓰지 마세요.
형식: [{"id":"...","text":"번역된 문제","concept":"번역된 개념","choices":["번역된 선택지1","번역된 선택지2"]}]`;
        const payload=qs.map(q=>({id:q.id,text:q.text,concept:q.concept||"",choices:(q.type||"choice")==="choice"?(q.choices||[]):undefined}));
        const raw=await askAI([{role:"user",parts:[{text:JSON.stringify(payload)}]}],sys,3000);
        const arr=extractJSON(raw);
        const map={};
        if(Array.isArray(arr))arr.forEach(x=>{if(x&&x.id)map[x.id]={text:x.text||"",concept:x.concept||"",choices:Array.isArray(x.choices)?x.choices.map(String):undefined};});
        if(alive)setQTrans(map);
      }catch(e){console.error("문제 번역 실패:",e);}
      if(alive)setTransReady(true);
    })();
    return()=>{alive=false;};
  },[confirmed,lang,asm]);

  const avg=arr=>{const scored=arr.filter(a=>a.response&&typeof a.score==="number");return scored.length?scored.reduce((s,a)=>s+a.score,0)/scored.length:0;};

  const persist=async(ansArr,submitted)=>{
    const entry={studentId:confirmed,answers:ansArr,avgScore:avg(ansArr),submitted,lang,updatedAt:new Date().toISOString()};
    setSaveStatus("saving");
    for(let attempt=1;attempt<=3;attempt++){
      try{await DB.setROne(ownerUid, asmId, entry);setSaveStatus("saved");setTimeout(()=>setSaveStatus(""),2000);return;}
      catch(e){console.error(`저장 시도 ${attempt} 실패:`,e);if(attempt<3)await new Promise(r=>setTimeout(r,500*attempt));}
    }
    setSaveStatus("error");
  };

  const evaluate=async(q,response)=>{
    const sys=`당신은 ${asm?.grade||"중학교"} ${asm?.subject||"과학"} 진단평가 채점 AI입니다.
학생의 답변을 모범답안·핵심개념과 비교하여 이해 수준을 진단합니다.

[문제] ${q.text}
[진단하려는 핵심 개념] ${q.concept||"(미지정)"}
[모범답안/채점 핵심] ${q.answer||"(교사 미입력 — 문제와 개념을 기준으로 상식적으로 판단)"}

[진단 수준]
- 도달: 핵심 개념을 정확히 이해함 (score 80~100)
- 부분도달: 부분적으로 이해했으나 오개념·불완전함 있음 (score 40~79)
- 미도달: 이해하지 못했거나 무응답/오답 (score 0~39)

[규칙]
- 학생 수준에 맞게 진단합니다.
- 무응답, "모르겠다", 문제와 무관한 답은 미도달·score 0.
- diagnosis: 학생 답변의 잘한 점과 부족한 점을 구체적으로 1~2문장.
- explanation: 이 개념을 학생이 이해할 수 있도록 쉽게 설명(복습 자료 역할, 2~3문장).
- ★언어 규칙★ diagnosis와 explanation은 반드시 ${t.aiLang}(으)로 작성하세요. 단, level 값은 반드시 "도달"/"부분도달"/"미도달" 중 하나로 한국어 원문 그대로 출력하세요 (번역 금지).
- 반드시 JSON만 출력. 다른 텍스트 금지.

[응답 형식]
{"level":"도달|부분도달|미도달","score":0~100 정수,"diagnosis":"...","explanation":"..."}`;
    const raw=await askAI([{role:"user",parts:[{text:`학생 답변: ${response}`}]}],sys,900);
    let parsed;try{parsed=extractJSON(raw)||{level:"미도달",score:0,diagnosis:raw,explanation:""};}catch{parsed={level:"미도달",score:0,diagnosis:raw,explanation:""};}
    let s=parseInt(parsed.score);if(isNaN(s)||s<0)s=0;if(s>100)s=100;parsed.score=s;
    if(!["도달","부분도달","미도달"].includes(parsed.level))parsed.level=s>=80?"도달":s>=40?"부분도달":"미도달";
    return parsed;
  };

  // 객관식 개념 해설 생성 (채점은 결정적으로, 해설만 AI)
  const explainMC=async(q,selIdx,isCorrect)=>{
    try{
      const sys=`당신은 ${asm?.grade||"중학교"} ${asm?.subject||"과학"} 교사입니다. 학생이 아래 객관식 문제를 풀었습니다.
[문제] ${q.text}
[선택지] ${(q.choices||[]).map((c,i)=>`${i+1}) ${c}`).join("  ")}
[정답 번호] ${q.correct+1}
[학생이 고른 번호] ${selIdx+1}
[정답 여부] ${isCorrect?"정답":"오답"}
이 문제의 핵심 개념을 학생이 이해하도록 쉽게 설명하는 explanation을 2~3문장으로 작성하세요. 오답이면 왜 학생의 선택이 틀렸는지도 짚어주세요.
explanation은 반드시 ${t.aiLang}(으)로 작성하세요. 반드시 JSON만 출력: {"explanation":"..."}`;
      const raw=await askAI([{role:"user",parts:[{text:"개념 해설을 작성하세요."}]}],sys,600);
      const p=extractJSON(raw);
      return(p&&p.explanation)||"";
    }catch{return"";}
  };

  const submitAnswer=async()=>{
    if(loading)return;
    const q=questions[idx];const isChoice=(q.type||"choice")==="choice";
    if(isChoice){if(selected==null)return;}else{if(!input.trim())return;}
    setLoading(true);
    try{
      let rec;
      if(isChoice){
        const isCorrect=selected===q.correct;
        const explanation=await explainMC(q,selected,isCorrect);
        rec={questionId:q.id,type:"choice",selected,response:(q.choices||[])[selected]||"",level:isCorrect?"도달":"미도달",score:isCorrect?100:0,diagnosis:isCorrect?mc("correct"):mc("incorrect"),explanation};
      }else{
        const response=input.trim();
        const ev=await evaluate(q,response);
        rec={questionId:q.id,type:"short",response,level:ev.level,score:ev.score,diagnosis:ev.diagnosis,explanation:ev.explanation};
      }
      const nextAns=[...answers.filter(a=>a.questionId!==q.id),rec];
      setAnswers(nextAns);
      const isLast=idx>=questions.length-1;
      await persist(nextAns,isLast);
      if(isLast){setPhase("done");}else{setIdx(idx+1);setInput("");setSelected(null);}
    }catch(e){alert("채점 오류: "+e.message);}
    setLoading(false);
  };

  if(!ready)return<Center><div style={{color:"#94A3B8"}}>{t.loading}</div></Center>;
  if(!asm)return<Center><div style={{textAlign:"center",color:"#94A3B8"}}><div style={{fontSize:40}}>🔍</div><div style={{marginTop:10}}>{t.notFound}</div></div></Center>;

  // 학번 입력 + 언어 선택
  if(!confirmed)return(
    <Center>
      <div style={{background:"white",borderRadius:20,padding:32,width:340,boxShadow:"0 16px 48px rgba(0,0,0,0.15)",textAlign:"center"}}>
        <div style={{fontSize:40,marginBottom:10}}>🩺</div>
        <div style={{fontWeight:900,fontSize:20,color:BL,marginBottom:3}}>DIAGNOSE AI</div>
        <div style={{fontWeight:700,fontSize:14,color:DK,marginBottom:3}}>{asm.title}</div>
        {asm.subject&&<div style={{fontSize:12,color:"#64748B",marginBottom:8}}>📚 {asm.subject}</div>}
        <div style={{fontSize:12,color:"#94A3B8",marginBottom:16}}>{t.qCount(questions.length)}</div>

        <label style={{display:"block",textAlign:"left",fontSize:12,fontWeight:600,color:"#475569",marginBottom:6}}>{t.langLabel}</label>
        <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:16}}>
          {LANGS.map(([code,name])=>(
            <button key={code} onClick={()=>setLang(code)} style={{padding:"7px 10px",borderRadius:8,fontSize:12,fontWeight:700,cursor:"pointer",border:lang===code?`2px solid ${BL}`:"1px solid #E2E8F0",background:lang===code?"#EFF6FF":"white",color:lang===code?BL:"#475569"}}>{name}</button>
          ))}
        </div>

        <label style={{display:"block",textAlign:"left",fontSize:12,fontWeight:600,color:"#475569",marginBottom:6}}>{t.idLabel}</label>
        <input value={sid} onChange={e=>setSid(e.target.value)} onKeyDown={e=>e.key==="Enter"&&sid.trim()&&setConfirmed(sid.replace(/\s+/g,""))} placeholder={t.idPh} autoFocus
          style={{...inp,fontSize:18,textAlign:"center",fontWeight:700,padding:"12px",borderRadius:10}}/>
        <button onClick={()=>sid.trim()&&setConfirmed(sid.replace(/\s+/g,""))} style={btn(BL,undefined,{width:"100%",marginTop:10,padding:"12px",fontSize:14,borderRadius:10})}>{t.confirm}</button>
      </div>
    </Center>
  );

  // 문제 번역 대기 화면 (한국어 외 언어 선택 시)
  if(lang!=="ko"&&!transReady)return(
    <Center>
      <div style={{textAlign:"center",color:"#64748B"}}>
        <div style={{fontSize:34,marginBottom:12}}>🌐</div>
        <div style={{fontSize:14,fontWeight:600}}>{TRANSLATING[lang]||TRANSLATING.ko}</div>
      </div>
    </Center>
  );

  // 완료 화면 — 진단 리포트
  if(phase==="done"){
    const ans=a=>a&&(a.selected!=null||(a.response&&a.response.trim()));
    const scored=answers.filter(ans);
    const avgScore=Math.round(avg(answers));
    const cnt={도달:0,부분도달:0,미도달:0};answers.forEach(a=>{if(ans(a))cnt[a.level]=(cnt[a.level]||0)+1;});
    const weak=questions.filter(q=>{const a=answers.find(x=>x.questionId===q.id);return a&&(a.level==="미도달"||a.level==="부분도달");});
    return(
      <div style={{minHeight:"100vh",background:"#F1F5F9",paddingBottom:40}}>
        <div style={{background:BL,color:"white",padding:"16px 16px 24px"}}>
          <div style={{maxWidth:560,margin:"0 auto"}}>
            <div style={{fontWeight:900,fontSize:16}}>DIAGNOSE AI</div>
            <div style={{fontSize:12,opacity:0.8,marginBottom:16}}>{asm.title} · {confirmed}</div>
            <div style={{background:"rgba(255,255,255,0.15)",borderRadius:12,padding:16,textAlign:"center"}}>
              <div style={{fontSize:12,opacity:0.85}}>{t.overall}</div>
              <div style={{fontSize:40,fontWeight:900,margin:"2px 0"}}>{avgScore}%</div>
              <div style={{fontSize:12,opacity:0.9}}>{t.summary(cnt.도달,cnt.부분도달,cnt.미도달)}</div>
            </div>
          </div>
        </div>
        <div style={{maxWidth:560,margin:"-12px auto 0",padding:"0 16px"}}>
          {weak.length>0&&(
            <div style={{background:"#FFF7ED",border:"1px solid #FED7AA",borderRadius:12,padding:14,marginBottom:14}}>
              <div style={{fontWeight:700,color:"#9A3412",fontSize:13,marginBottom:6}}>{t.reviewNeeded}</div>
              <div style={{fontSize:12,color:"#7C2D12",lineHeight:1.7}}>{weak.map(q=>qConcept(q)||qText(q).slice(0,20)).join(" · ")}</div>
            </div>
          )}
          {questions.map((q,i)=>{const a=answers.find(x=>x.questionId===q.id);const isChoice=(q.type||"choice")==="choice";const lv=a&&(a.response||a.selected!=null)?a.level:"미응답";const c=LV[lv];const ch=qChoices(q);const chosen=isChoice&&a&&a.selected!=null?(ch[a.selected]??a.response):a?.response;const isWrong=isChoice&&a&&a.selected!=null&&a.selected!==q.correct;return(
            <div key={q.id} style={{background:"white",borderRadius:12,padding:16,marginBottom:12,boxShadow:"0 1px 4px rgba(0,0,0,0.06)"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,marginBottom:8}}>
                <span style={{fontWeight:700,fontSize:13,color:DK}}>{t.problemN(i+1)}</span>
                <LevelBadge level={lv} label={t.levels[lv]}/>
              </div>
              <div style={{fontSize:13,color:DK,marginBottom:8,lineHeight:1.6}}>{qText(q)}</div>
              <div style={{fontSize:12,color:"#334155",background:"#F8FAFC",borderRadius:8,padding:"8px 10px",marginBottom:8}}><b style={{color:BL}}>{t.myAnswer}</b> {chosen||t.noAnswer}</div>
              {isWrong&&<div style={{fontSize:12,color:"#166534",background:"#F0FDF4",borderRadius:8,padding:"8px 10px",marginBottom:8,border:"1px solid #BBF7D0"}}><b>{mc("correctAnswer")}</b> {ch[q.correct]}</div>}
              {a?.diagnosis&&<div style={{fontSize:12,color:c.fg,background:c.bg,borderRadius:8,padding:"8px 10px",marginBottom:6,lineHeight:1.6}}>🩺 <b>{t.diagnosis}</b> {a.diagnosis}</div>}
              {a?.explanation&&<div style={{fontSize:12,color:"#475569",lineHeight:1.6}}>📖 <b>{t.conceptReview}</b> {a.explanation}</div>}
            </div>
          );})}
          <div style={{textAlign:"center",color:"#94A3B8",fontSize:12,padding:"10px 0 20px"}}>{t.complete}</div>
        </div>
      </div>
    );
  }

  // 문제 풀이 화면
  const q=questions[idx];
  const isChoice=(q.type||"choice")==="choice";
  const choices=qChoices(q);
  const prevAns=answers.find(a=>a.questionId===q.id);
  const canSubmit=isChoice?selected!=null:!!input.trim();
  return(
    <div style={{display:"flex",flexDirection:"column",height:"100vh",background:"#F1F5F9"}}>
      <div style={{background:BL,color:"white",padding:"10px 14px",flexShrink:0}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div><div style={{fontWeight:900,fontSize:15}}>DIAGNOSE AI</div><div style={{fontSize:11,opacity:0.75}}>{asm.title}</div></div>
          <div style={{textAlign:"right"}}><div style={{fontSize:11,opacity:0.75}}>👤 {confirmed}</div><div style={{fontWeight:800,fontSize:14}}>{t.progress(idx+1,questions.length)}</div></div>
        </div>
        <div style={{marginTop:8,height:6,background:"rgba(255,255,255,0.25)",borderRadius:6,overflow:"hidden"}}>
          <div style={{height:"100%",width:`${(idx)/questions.length*100}%`,background:"white",borderRadius:6,transition:"width 0.3s"}}/>
        </div>
        {saveStatus==="saving"&&<div style={{marginTop:8,background:"rgba(255,255,255,0.2)",borderRadius:7,padding:"6px 12px",fontSize:11,fontWeight:600}}>{t.saving}</div>}
        {saveStatus==="saved"&&<div style={{marginTop:8,background:"#10B981",borderRadius:7,padding:"6px 12px",fontSize:11,fontWeight:600}}>{t.saved}</div>}
        {saveStatus==="error"&&<div style={{marginTop:8,background:"#DC2626",borderRadius:7,padding:"6px 12px",fontSize:11,fontWeight:700}}>{t.saveErr}</div>}
      </div>

      <div style={{flex:1,overflowY:"auto",padding:16}}>
        <div style={{maxWidth:560,margin:"0 auto"}}>
          {qConcept(q)&&<div style={{fontSize:11,color:BL,fontWeight:700,marginBottom:6}}>🔎 {qConcept(q)}</div>}
          <div style={{background:"white",borderRadius:12,padding:18,boxShadow:"0 1px 4px rgba(0,0,0,0.07)",fontSize:15,color:DK,lineHeight:1.7,fontWeight:600}}>
            Q{idx+1}. {qText(q)}
          </div>

          {isChoice&&(
            <div style={{marginTop:14}}>
              <div style={{fontSize:12,color:"#64748B",fontWeight:600,marginBottom:8}}>{mc("pickAnswer")}</div>
              <div style={{display:"flex",flexDirection:"column",gap:8}}>
                {choices.map((c,ci)=>{const on=selected===ci;return(
                  <button key={ci} onClick={()=>!loading&&setSelected(ci)} disabled={loading} style={{display:"flex",alignItems:"center",gap:12,textAlign:"left",padding:"13px 14px",borderRadius:10,cursor:loading?"default":"pointer",border:on?`2px solid ${BL}`:"1px solid #E2E8F0",background:on?"#EFF6FF":"white",boxShadow:on?"0 2px 8px rgba(29,78,216,0.12)":"0 1px 3px rgba(0,0,0,0.05)"}}>
                    <span style={{width:26,height:26,flexShrink:0,borderRadius:"50%",border:on?`2px solid ${BL}`:"2px solid #CBD5E1",background:on?BL:"white",color:"white",fontWeight:900,fontSize:13,display:"flex",alignItems:"center",justifyContent:"center"}}>{String.fromCharCode(65+ci)}</span>
                    <span style={{fontSize:14,color:DK,lineHeight:1.5,fontWeight:on?700:500}}>{c}</span>
                  </button>
                );})}
              </div>
            </div>
          )}

          {!isChoice&&prevAns&&prevAns.response&&(
            <div style={{marginTop:12}}>
              <div style={{fontSize:12,color:"#64748B",marginBottom:4}}>{t.prevAnswer}</div>
              <div style={{background:"#EFF6FF",borderRadius:10,padding:"10px 13px",fontSize:13,color:"#334155"}}>{prevAns.response}</div>
              <div style={{marginTop:8,display:"flex",alignItems:"center",gap:8}}>
                <LevelBadge level={prevAns.level} small label={t.levels[prevAns.level]}/>
                {prevAns.diagnosis&&<span style={{fontSize:12,color:"#475569"}}>🩺 {prevAns.diagnosis}</span>}
              </div>
            </div>
          )}
        </div>
      </div>

      <div style={{padding:"12px 16px",background:"white",borderTop:"1px solid #E2E8F0",flexShrink:0}}>
        <div style={{maxWidth:560,margin:"0 auto"}}>
          {!isChoice&&<textarea value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey))submitAnswer();}} placeholder={t.answerPh} disabled={loading}
            style={{...inp,height:70,resize:"none",marginBottom:8}}/>}
          <button onClick={submitAnswer} disabled={loading||!canSubmit} style={btn(loading||!canSubmit?"#CBD5E1":BL,undefined,{width:"100%",padding:"13px",fontSize:15,borderRadius:9,cursor:loading?"not-allowed":"pointer"})}>
            {loading?t.diagnosing:idx>=questions.length-1?t.submitLast:t.submitNext}
          </button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
