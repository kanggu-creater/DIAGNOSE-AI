/* ── Gemini (키는 Firebase /config/geminiKey 에서 로드) ── */
const CFG={get key(){return localStorage.getItem("bwd_key")||"";},set key(v){localStorage.setItem("bwd_key",v);}};
async function loadGeminiKey(){try{const r=await fetch(FB+"/config/geminiKey.json");const d=await r.json();if(d&&typeof d==="string"){CFG.key=d;return true;}}catch{}return !!CFG.key;}
async function gemini(parts,sys,maxTokens=8192){
  if(!CFG.key)throw new Error("Gemini 키가 설정되지 않았습니다.");
  const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${CFG.key}`,{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({system_instruction:{parts:[{text:sys}]},contents:[{role:"user",parts}],generationConfig:{maxOutputTokens:maxTokens,temperature:0.5,thinkingConfig:{thinkingBudget:0},responseMimeType:"application/json"}})
  });
  const d=await res.json();
  if(d.error)throw new Error(d.error.message);
  if(!d.candidates||!d.candidates[0])throw new Error("응답이 비어 있습니다.");
  return (d.candidates[0].content.parts||[]).filter(p=>p.text).map(p=>p.text).join("");
}
async function geminiJSON(parts,sys,mt=8192){return extractJson(await gemini(parts,sys,mt));}
function extractJson(text){
  let t=(text||"").trim().replace(/```json/gi,"").replace(/```/g,"").trim();
  const s=t.indexOf("{");if(s>0)t=t.slice(s);
  const tp=str=>{try{return JSON.parse(str);}catch(e){return undefined;}};
  let o=tp(t);if(o)return o;
  const stackAt=str=>{const st=[];let q=false,e=false;for(const ch of str){if(q){if(e)e=false;else if(ch==="\\")e=true;else if(ch==='"')q=false;continue;}if(ch==='"'){q=true;continue;}if(ch==="{")st.push("}");else if(ch==="[")st.push("]");else if(ch==="}"||ch==="]")st.pop();}return st;};
  let q=false,e=false,depth=0,cut=-1;
  for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(e)e=false;else if(ch==="\\")e=true;else if(ch==='"')q=false;continue;}if(ch==='"'){q=true;continue;}if(ch==="{"||ch==="[")depth++;else if(ch==="}"||ch==="]"){depth--;if(depth>=1)cut=i;}}
  if(cut>0){let h=t.slice(0,cut+1).replace(/,\s*$/,"");const st=stackAt(h);for(let i=st.length-1;i>=0;i--)h+=st[i];o=tp(h);if(o)return o;}
  throw new Error("AI 응답을 해석하지 못했습니다. 다시 시도해 주세요.");
}

/* ── AI: 오개념 분석 + 이단계 문항 ── */
function normMc(m){return {id:m.id||("M"+Math.random().toString(36).slice(2,5)),name:m.name||"",description:m.description||""};}
function normQ(q){return {
  type:"이단계형",question:q.question||"",options:Array.isArray(q.options)?q.options:[],answer:q.answer||"",
  reasonPrompt:q.reasonPrompt||"위와 같이 생각한 이유로 가장 알맞은 것은?",reasons:Array.isArray(q.reasons)?q.reasons:[],
  reasonAnswer:q.reasonAnswer||"",reasonMap:Array.isArray(q.reasonMap)?q.reasonMap:[],targets:Array.isArray(q.targets)?q.targets:[],
  concept:q.concept||"",explanation:q.explanation||""};}
function ctxStr(d){return `- 교육과정: ${d.curriculum}\n- 학년: ${d.grade}\n- 학습 주제: ${d.topic||"(미입력 — 학년 수준 대표 주제 자율)"}\n- 추가 요청: ${d.request||"없음"}`;}

async function aiGenerate(d,count,mccount){
  const sys="너는 대한민국 중학교 과학교육과 학생 오개념(misconception) 연구에 정통한 전문가야. 오직 JSON만 출력.";
  const txt=`${ctxStr(d)}

[1단계·오개념 분석] 이 주제에서 해당 학년 학생이 흔히 갖는, 과학교육 문헌에서 반복적으로 보고되는 대표 오개념을 ${mccount}개. 없는 출처·논문 제목 지어내지 말 것. 각: id("M1"..), name(한 줄), description(어떻게·왜 오해하는지 1~2문장).

[2단계·이단계형 문항] 위 오개념을 진단하는 이단계형 문항 ${count}개.
- 1단계: 현상/상황 객관식(선택지 4개 ①~④, 정답 1개).
- 2단계: '그렇게 생각한 이유' 객관식(선택지 4개). 정확히 1개만 옳은 이유, 나머지 오답은 각각 특정 오개념(M#) 반영.
- reasonMap: 2단계 선택지 순서대로 "correct" 또는 오개념 id (길이 4, "correct" 정확히 1개).
- 1·2단계 모두 맞아야 올바른 이해. 발문은 학생 수준·일상 상황 기반.

JSON: {"misconceptions":[{"id":"M1","name":"","description":""}],"questions":[{"type":"이단계형","question":"","options":["① ","② ","③ ","④ "],"answer":"","reasonPrompt":"","reasons":["① ","② ","③ ","④ "],"reasonAnswer":"","reasonMap":["","correct","",""],"targets":["M1"],"concept":"","explanation":""}]}`;
  const o=await geminiJSON([{text:txt}],sys);
  return {misconceptions:(o.misconceptions||[]).map(normMc),questions:(o.questions||[]).map(normQ)};
}
async function aiRegenFromMc(d,mcs,count){
  const sys="너는 중학교 과학 오개념 진단 이단계형 출제 전문가야. 오직 JSON만 출력.";
  const mcList=mcs.map(m=>`${m.id}: ${m.name} — ${m.description}`).join("\n");
  const txt=`${ctxStr(d)}\n아래 고정 오개념만 사용(새로 만들지 말 것):\n${mcList}\n\n이단계형 문항 ${count}개. 각 문항 1단계(현상 4지,정답1)+2단계(이유 4지,정답1,오답은 위 오개념 반영). reasonMap은 2단계 순서대로 "correct" 또는 위 id.\nJSON: {"questions":[{"type":"이단계형","question":"","options":["① ","② ","③ ","④ "],"answer":"","reasonPrompt":"","reasons":["① ","② ","③ ","④ "],"reasonAnswer":"","reasonMap":["","correct","",""],"targets":["M1"],"concept":"","explanation":""}]}`;
  const o=await geminiJSON([{text:txt}],sys);
  return (o.questions||[]).map(normQ);
}
async function aiRegenOne(d,mcs,existing){
  const sys="너는 중학교 과학 오개념 진단 이단계형 출제 전문가야. 오직 JSON만 출력.";
  const mcList=mcs.map(m=>`${m.id}: ${m.name} — ${m.description}`).join("\n");
  const txt=`${ctxStr(d)}\n오개념(이 id만 사용):\n${mcList}\n기존 문항:\n${existing}\n기존과 겹치지 않는 새 이단계형 문항 1개.\nJSON: {"question":{"type":"이단계형","question":"","options":["① ","② ","③ ","④ "],"answer":"","reasonPrompt":"","reasons":["① ","② ","③ ","④ "],"reasonAnswer":"","reasonMap":["","correct","",""],"targets":["M1"],"concept":"","explanation":""}}`;
  const o=await geminiJSON([{text:txt}],sys);
  return normQ(o.question||o);
}

/* ── 채점 ── */
function normText(s){return (s||"").toString().trim().toLowerCase().replace(/[①-⑨]/g,"").replace(/^[0-9]+[.)]\s*/,"").replace(/\s+/g,"").replace(/[.,!?·、。]/g,"");}
function idxByText(options,ans){options=options||[];for(const ch of (ans||"")){const k=CIRCLED.indexOf(ch);if(k>=0&&k<options.length)return k;}const na=normText(ans);if(!na)return -1;let best=-1;options.forEach((o,i)=>{if(normText(o)===na)best=i;});if(best<0)options.forEach((o,i)=>{if(na&&normText(o).includes(na))best=i;});return best;}
function gradeSub(key,sub){
  const mcHeld={};
  const marks=(key.questions||[]).map((q,i)=>{
    const a=(sub.answers||[]).find(x=>x.qIndex===i);
    const t1=a?a.selectedIndex:-1, t2=(a&&a.reasonIndex!=null)?a.reasonIndex:-1;
    if(t1<0||t2<0)return "N";
    const c1=idxByText(q.options,q.answer);
    const m2=Array.isArray(q.reasonMap)?q.reasonMap[t2]:null;
    if(m2&&m2!=="correct")mcHeld[m2]=(mcHeld[m2]||0)+1;
    return (t1===c1&&m2==="correct")?"O":"X";
  });
  return {marks,mcHeld};
}
function relatedQs(key,id){return (key.questions||[]).map((q,i)=>((q.reasonMap||[]).includes(id)?(i+1):null)).filter(Boolean);}
function mcNameFrom(key,id){const m=(key.misconceptions||[]).find(x=>x.id===id);return m?m.name:id;}

/* ── DB (/misdx) ── */
const DB={
  async listQuiz(uid){try{const r=await fetch(`${FB}/misdx/quizzes/${uid}.json`);const d=await r.json();if(!d)return[];return Object.values(d).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));}catch{return[];}},
  async saveQuiz(uid,quiz,key){
    await fetch(`${FB}/misdx/quizzes/${uid}/${quiz.id}.json`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(quiz)});
    await fetch(`${FB}/misdx/keys/${uid}/${quiz.id}.json`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(key)});
  },
  async delQuiz(uid,id){await fetch(`${FB}/misdx/quizzes/${uid}/${id}.json`,{method:"DELETE"});await fetch(`${FB}/misdx/keys/${uid}/${id}.json`,{method:"DELETE"});await fetch(`${FB}/misdx/results/${uid}/${id}.json`,{method:"DELETE"});},
  async findById(id){try{const r=await fetch(`${FB}/misdx/quizzes.json`);const d=await r.json();if(!d)return null;for(const uid of Object.keys(d))if(d[uid][id])return {...d[uid][id],_ownerUid:uid};return null;}catch{return null;}},
  async findByCode(code){try{const r=await fetch(`${FB}/misdx/quizzes.json`);const d=await r.json();if(!d)return null;for(const uid of Object.keys(d))for(const id of Object.keys(d[uid]))if(shortCode(id)===code.toUpperCase())return {...d[uid][id],_ownerUid:uid};return null;}catch{return null;}},
  async getKey(uid,id){try{const r=await fetch(`${FB}/misdx/keys/${uid}/${id}.json`);return await r.json();}catch{return null;}},
  async getResults(uid,id){try{const r=await fetch(`${FB}/misdx/results/${uid}/${id}.json`);const d=await r.json();if(!d)return[];return Object.values(d);}catch{return[];}},
  async setResult(uid,id,data){const k=(data.studentId||"").replace(/[.#$/[\]\s]/g,"_");const res=await fetch(`${FB}/misdx/results/${uid}/${id}/${k}.json`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});if(!res.ok)throw new Error("저장 실패: "+res.status);return res.json();}
};

/* ── 공통 UI ── */
function Center({children}){return <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",background:PAPER,padding:16}}>{children}</div>;}
function Empty({icon,text}){return <div style={{textAlign:"center",padding:52,color:"#94A3B8"}}><div style={{fontSize:34,marginBottom:10}}>{icon}</div><div style={{fontSize:14}}>{text}</div></div>;}
function Err({msg}){return msg?<div style={{background:"#FCEEEC",border:"1px solid #E6C3BD",color:"#8F3B33",borderRadius:9,padding:"11px 14px",fontSize:13,marginTop:10}}>{msg}</div>:null;}
function Loading({label}){return <span><span className="spin" style={{marginRight:8}}></span>{label}</span>;}
function Badge({children,bg,col}){return <span style={{fontSize:11,fontWeight:700,padding:"2px 9px",borderRadius:20,background:bg,color:col}}>{children}</span>;}
function QRImage({url}){const ref=useRef(null);useEffect(()=>{if(!url||!ref.current)return;ref.current.innerHTML="";const gen=()=>new window.QRCode(ref.current,{text:url,width:200,height:200,correctLevel:window.QRCode.CorrectLevel.M});window.QRCode?gen():(()=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";s.onload=gen;document.head.appendChild(s);})();},[url]);return <div ref={ref} style={{lineHeight:0}}/>;}

/* ══════════ ROOT ══════════ */
function App(){
  const [mode,setMode]=useState("loading"),[sQuiz,setSQuiz]=useState(null),[user,setUser]=useState(null);
  useEffect(()=>{(async()=>{
    const q=new URLSearchParams(location.search);const id=q.get("id"),code=q.get("code");
    if(id){const a=await DB.findById(id);if(a){setSQuiz(a);setMode("student");return;}}
    if(code){const a=await DB.findByCode(code);if(a){setSQuiz(a);setMode("student");return;}}
    await loadGeminiKey();
    let w=0;while((typeof firebase==="undefined"||!firebase.auth)&&w<8000){await new Promise(r=>setTimeout(r,100));w+=100;}
    if(typeof firebase!=="undefined"&&firebase.auth){firebase.auth().onAuthStateChanged(u=>{if(u&&u.isAnonymous)return;setUser(u);setMode(u?"teacher":"login");});}
    else setMode("login");
  })();},[]);
  if(mode==="loading")return <Center><div style={{color:"#94A3B8"}}>로딩 중…</div></Center>;
  if(mode==="student")return <StudentPage quiz={sQuiz}/>;
  if(mode==="login")return <LoginPage/>;
  return <TeacherApp user={user}/>;
}

function LoginPage(){
  const [view,setView]=useState("main"),[code,setCode]=useState(""),[err,setErr]=useState(""),[busy,setBusy]=useState(false);
  const login=async()=>{let w=0;while((typeof firebase==="undefined"||!firebase.auth)&&w<5000){await new Promise(r=>setTimeout(r,200));w+=200;}if(typeof firebase==="undefined"||!firebase.auth){alert("로그인 연결 실패. 새로고침(F5) 후 시도하세요.");return;}try{await firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider());}catch(e){alert("로그인 오류: "+e.message);}};
  const enter=async()=>{const c=code.replace("#","").trim().toUpperCase();if(c.length!==6){setErr("입장 코드는 6자리입니다.");return;}setBusy(true);setErr("");const a=await DB.findByCode(c);if(!a){setErr("존재하지 않는 코드입니다.");setBusy(false);return;}location.search=`?code=${c}`;};

      <p style={{color:MUT,fontSize:13,marginBottom:22}}>선생님이 준 6자리 입장 코드를 입력하세요</p>
      <input value={code} onChange={e=>{setCode(e.target.value.toUpperCase());setErr("");}} onKeyDown={e=>e.key==="Enter"&&!busy&&enter()} placeholder="A3F2B1" maxLength={6} autoFocus disabled={busy} style={{...inp,fontSize:26,textAlign:"center",fontWeight:900,letterSpacing:6,padding:16,borderColor:err?"#FCA5A5":LINE}}/>
      <Err msg={err}/>
      <button onClick={enter} disabled={busy} style={btn(busy?"#94A3B8":GR,"#fff",{width:"100%",padding:14,marginTop:12})}>{busy?"확인 중…":"입장하기"}</button>
      <button onClick={()=>{setView("main");setCode("");setErr("");}} style={{width:"100%",padding:11,background:"none",border:"none",color:MUT,fontSize:13,cursor:"pointer",marginTop:4,fontWeight:600}}>← 뒤로</button>
    </div></Center>
  );
  return(
    <Center><div style={{background:"#fff",borderRadius:20,padding:38,width:400,boxShadow:"0 16px 48px rgba(16,52,34,.12)",textAlign:"center"}}>
      <div style={{fontSize:42,marginBottom:10}}>🧠</div>
      <h1 style={{fontSize:23,fontWeight:900,color:GR,marginBottom:6,lineHeight:1.3}}>AI 오개념 진단평가<br/><span style={{fontSize:15,color:PUR}}>이단계형(two-tier)</span></h1>

function MakeTab({uid,onSaved}){

  const gen=async()=>{if(!CFG.key){setErr("Gemini 키가 없습니다. 위 배너에서 입력하세요.");return;}
    setErr("");setBusy("gen");
    try{const {misconceptions,questions}=await aiGenerate(f,Math.max(1,Math.min(12,+f.count||5)),Math.max(3,Math.min(8,+f.mccount||5)));

    try{setQs(await aiRegenFromMc(f,mcs,Math.max(1,Math.min(12,+f.count||5))));}catch(e){setErr(e.message);}setBusy("");};
  const regenOne=async i=>{setErr("");setBusy("q"+i);
    try{const existing=qs.map((q,idx)=>(idx+1)+". "+q.question).join("\n");const nq=await aiRegenOne(f,mcs,existing);setQs(qs.map((q,idx)=>idx===i?nq:q));}catch(e){setErr(e.message);}setBusy("");};

  const mcNm=id=>{const m=mcs.find(x=>x.id===id);return m?m.name:id;};
  const save=async()=>{if(!title.trim()){setErr("평가 제목을 입력하세요.");return;}if(!qs.length){setErr("먼저 문항을 생성하세요.");return;}

            <textarea value={m.description} onChange={e=>setMcs(mcs.map((x,j)=>j===i?{...x,description:e.target.value}:x))} style={{...inp,height:46,resize:"vertical"}}/>
            <button onClick={()=>setMcEdit(-1)} style={btn(GR,"#fff",{marginTop:8,fontSize:13,padding:"7px 14px"})}>완료</button>

            <button onClick={()=>setMcEdit(i)} style={{...btn("#fff",MUT,{fontSize:12,padding:"5px 9px",border:"1px solid "+LINE})}}>수정</button>

        {qs.map((q,i)=> qEdit===i?(

        ))}
        <div style={{...card,marginTop:6}}>
          <label style={lab}>평가 제목 *</label>
          <input value={title} onChange={e=>setTitle(e.target.value)} placeholder="예: 마찰전기와 정전기 유도 오개념 진단" style={{...inp,marginBottom:12}}/>
          <div style={{display:"flex",justifyContent:"flex-end"}}><button onClick={save} disabled={!!busy} style={btn(GB,"#fff",{padding:"13px 28px",fontSize:15})}>{busy==="save"?<Loading label="저장 중…"/>:"💾 저장 → 학생에게 공유"}</button></div>

function QCard({q,i,mcNm,busy,onEdit,onDel,onRegen}){
  const c1=idxByText(q.options,q.answer);
  const otag=(label,correct)=><span style={{fontFamily:"monospace",fontSize:10.5,fontWeight:700,padding:"2px 7px",borderRadius:12,marginLeft:6,background:correct?"#E5F2EB":PURW,color:correct?OKC:PUR}}>{label}</span>;

function QEditor({q,onSave,onCancel}){
  const [d,setD]=useState({...q,options:(q.options||[]).join("\n"),reasons:(q.reasons||[]).join("\n"),reasonMap:(q.reasonMap||[]).join("\n")});

    options:(d.options||"").split("\n").map(x=>x.trim()).filter(Boolean),reasons:(d.reasons||"").split("\n").map(x=>x.trim()).filter(Boolean),reasonMap:(d.reasonMap||"").split("\n").map(x=>x.trim()).filter(Boolean)});

  return <div style={{...card,border:"2px solid "+PUR}}>
    {F("1단계 발문(현상)","question",50)}

    {F("2단계 정답","reasonAnswer",0,"정답 이유 내용")}

    <div style={{display:"flex",gap:8}}><button onClick={done} style={btn(GR,"#fff",{fontSize:13,padding:"8px 16px"})}>저장</button><button onClick={onCancel} style={btn("#fff",MUT,{fontSize:13,padding:"8px 16px",border:"1px solid "+LINE})}>취소</button></div>

    <div>

        <div key={a.id} style={{...card,padding:"16px 18px",marginBottom:12}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:12,flexWrap:"wrap"}}>

            </div>
            <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
              <span style={{fontSize:18,fontWeight:900,color:GR,letterSpacing:2,background:SAGE,padding:"6px 12px",borderRadius:8}}>#{shortCode(a.id)}</span>
              <button onClick={()=>navigator.clipboard.writeText(url).then(()=>alert("학생용 링크 복사됨:\n"+url))} style={btn("#fff",GR,{border:"1px solid "+SAGEL,fontSize:12,padding:"8px 12px"})}>링크 복사</button>
              <button onClick={()=>setQr(qr===a.id?null:a.id)} style={btn("#fff",GR,{border:"1px solid "+SAGEL,fontSize:12,padding:"8px 12px"})}>{qr===a.id?"QR 닫기":"QR 보기"}</button>
              <button onClick={()=>copy(a)} disabled={busy===a.id} style={btn(SAGE,GR,{border:"1px solid "+SAGEL,fontSize:12,padding:"8px 12px"})}>{busy===a.id?"복사 중…":"📄 복사"}</button>
              <button onClick={()=>del(a.id)} style={btn("#FEF2F2","#DC2626",{border:"1px solid #FCA5A5",fontSize:12,padding:"8px 12px"})}>삭제</button>
            </div>
          </div>
          {qr===a.id&&<div style={{marginTop:14,display:"flex",flexDirection:"column",alignItems:"center",gap:8,padding:14,background:"#fff",border:"1px solid "+LINE,borderRadius:10}}><QRImage url={url}/><div style={{fontSize:12,color:MUT}}>스캔하면 바로 학생 풀이 화면 · 입장 코드 #{shortCode(a.id)}</div></div>}
        </div>
      );})}
    </div>
  );
}

/* ── 오개념 결과 탭 ── */
function ResultsTab({quizzes,uid}){
  const [sel,setSel]=useState(""),[key,setKey]=useState(null),[rows,setRows]=useState([]),[loading,setLoading]=useState(false);
  const load=async()=>{if(!sel)return;setLoading(true);const k=await DB.getKey(uid,sel);const subs=await DB.getResults(uid,sel);setKey(k);
    const rr=(subs||[]).map(s=>{const g=gradeSub(k||{questions:[]},s);const gradable=g.marks.filter(m=>m==="O"||m==="X"||m==="N").length,correct=g.marks.filter(m=>m==="O").length;
      return {studentId:s.studentId,time:fmtTime(s.submittedAt),marks:g.marks,mcHeld:g.mcHeld,gradable,correct,rate:gradable?Math.round(correct/gradable*100):0};}).sort((a,b)=>(a.studentId||"").localeCompare(b.studentId||""));
    setRows(rr);setLoading(false);};
  useEffect(()=>{if(!sel){setKey(null);setRows([]);return;}load();const iv=setInterval(load,6000);return()=>clearInterval(iv);},[sel]);
  const asm=quizzes.find(a=>a.id===sel);

  const mcStats=key?(key.misconceptions||[]).map(mc=>{const withIt=rows.filter(r=>r.mcHeld[mc.id]).length;
    return {id:mc.id,name:mc.name,description:mc.description,count:withIt,pct:rows.length?Math.round(withIt/rows.length*100):0,qNums:relatedQs(key,mc.id)};}).sort((a,b)=>b.count-a.count):[];
  const qCount=key?(key.questions||[]).length:0;
  const perQ=key?(key.questions||[]).map((q,i)=>{const ms=rows.map(r=>r.marks[i]);const g=ms.filter(m=>m==="O"||m==="X"||m==="N").length,o=ms.filter(m=>m==="O").length;return {rate:g?Math.round(o/g*100):null};}):[];

  const download=()=>{if(!key||!rows.length)return;
    const h1=["학번","제출시각",...Array.from({length:qCount},(_,i)=>`${i+1}번`),"정답수","보유 오개념"];
    const a1=[h1];rows.forEach(r=>a1.push([r.studentId,r.time,...r.marks.map(m=>({O:"O",X:"X",N:"미응답"}[m]||"·")),`${r.correct}/${r.gradable}`,Object.keys(r.mcHeld).map(id=>mcNameFrom(key,id)).join(", ")]));
    const a2=[["ID","오개념","설명","보유 학생 수","비율(%)","관련 문항"]];mcStats.forEach(m=>a2.push([m.id,m.name,m.description,m.count,m.pct,m.qNums.join(", ")]));
    const a3=[["문항","정답률(%)"]];(key.questions||[]).forEach((q,i)=>a3.push([`${i+1}번`,perQ[i].rate!=null?perQ[i].rate:"—"]));
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a1),"학생별 결과");
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a2),"오개념 현황");
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a3),"문항별 정답률");
    XLSX.writeFile(wb,`오개념진단_${(asm&&asm.title)||""}.xlsx`);
  };

  return(
    <div>
      <div style={{display:"flex",gap:10,marginBottom:16,alignItems:"center",flexWrap:"wrap"}}>
        <select value={sel} onChange={e=>setSel(e.target.value)} style={{...inp,flex:1,minWidth:200}}><option value="">📋 진단을 선택하세요</option>{quizzes.map(a=><option key={a.id} value={a.id}>{a.title}</option>)}</select>
        {sel&&<><span style={{fontSize:11,color:"#94A3B8"}}>● 6초마다 갱신</span><button onClick={load} style={btn("#fff",GR,{fontSize:13,padding:"9px 14px",border:"1px solid "+SAGEL})}>새로고침</button><button onClick={download} disabled={!rows.length} style={btn("#059669","#fff",{fontSize:13,padding:"9px 16px"})}>⬇ 엑셀</button></>}
      </div>
      {sel&&loading&&!rows.length&&<Empty icon="⏳" text="불러오는 중…"/>}
      {sel&&!loading&&!rows.length&&<Empty icon="⏳" text="아직 제출한 학생이 없습니다."/>}
      {sel&&rows.length>0&&<>
        <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:16}}>
          <Stat n={rows.length} l="제출 인원"/>
          <Stat n={key?(key.misconceptions||[]).length:0} l="진단 오개념"/>
          <Stat n={mcStats.length&&mcStats[0].count?mcStats[0].name:"—"} l="가장 흔한 오개념" small/>
        </div>

        <h3 style={{fontSize:15,fontWeight:800,margin:"6px 2px 10px"}}>🧠 오개념 현황 <span style={{fontWeight:400,fontSize:12,color:MUT}}>보유 학생 많은 순</span></h3>
        <div style={{...card,padding:0,overflow:"hidden"}}><div style={{overflowX:"auto"}}><table style={{borderCollapse:"collapse",width:"100%",fontSize:13,minWidth:560}}>
          <thead><tr>{["ID","오개념","보유 학생","비율","관련 문항"].map((h,i)=><th key={i} style={{background:"#F5F5F0",padding:"9px 11px",textAlign:i<2?"left":"center",fontWeight:700,color:MUT,borderBottom:"1px solid "+LINE}}>{h}</th>)}</tr></thead>
          <tbody>{mcStats.map(m=><tr key={m.id} style={{borderBottom:"1px solid "+LINE}}>
            <td style={{padding:"9px 11px",fontFamily:"monospace",fontWeight:700,color:PUR}}>{m.id}</td>
            <td style={{padding:"9px 11px",fontWeight:600}}>{m.name}<div style={{fontWeight:400,color:"#94A3B8",fontSize:12}}>{m.description}</div></td>
            <td style={{padding:"9px 11px",textAlign:"center",fontWeight:700}}>{m.count}명</td>
            <td style={{padding:"9px 11px",textAlign:"center"}}>{m.pct}%<div style={{width:110,height:7,background:LINE,borderRadius:5,margin:"4px auto 0",overflow:"hidden"}}><div style={{width:m.pct+"%",height:"100%",background:PUR}}/></div></td>
            <td style={{padding:"9px 11px",textAlign:"center",color:MUT}}>{m.qNums.join(", ")||"—"}</td>
          </tr>)}</tbody>
        </table></div></div>

        <h3 style={{fontSize:15,fontWeight:800,margin:"20px 2px 10px"}}>👩‍🎓 학생별 응답</h3>
        <div style={{...card,padding:0,overflow:"hidden"}}><div style={{overflowX:"auto"}}><table style={{borderCollapse:"collapse",width:"100%",fontSize:13,minWidth:560}}>
          <thead><tr>
            <th style={{background:"#F5F5F0",padding:"9px 11px",textAlign:"left",fontWeight:700,color:MUT,borderBottom:"1px solid "+LINE}}>학번</th>
            <th style={{background:"#F5F5F0",padding:"9px 11px",fontWeight:700,color:MUT,borderBottom:"1px solid "+LINE}}>시각</th>
            {(key.questions||[]).map((q,i)=><th key={i} style={{background:"#F5F5F0",padding:"9px 8px",fontWeight:700,color:MUT,borderBottom:"1px solid "+LINE}}>{i+1}<div style={{fontSize:10,fontWeight:400,color:"#94A3B8"}}>{perQ[i].rate!=null?perQ[i].rate+"%":""}</div></th>)}
            <th style={{background:"#F5F5F0",padding:"9px 11px",fontWeight:700,color:MUT,borderBottom:"1px solid "+LINE}}>정답</th>
            <th style={{background:"#F5F5F0",padding:"9px 11px",fontWeight:700,color:MUT,borderBottom:"1px solid "+LINE}}>보유 오개념</th>
          </tr></thead>
          <tbody>{rows.map(r=><tr key={r.studentId} style={{borderBottom:"1px solid "+LINE}}>
            <td style={{padding:"9px 11px",fontFamily:"monospace",fontWeight:700}}>{r.studentId}</td>
            <td style={{padding:"9px 11px",textAlign:"center",color:MUT,fontSize:12}}>{r.time}</td>
            {r.marks.map((m,i)=><td key={i} style={{padding:"9px 8px",textAlign:"center",fontWeight:800,color:m==="O"?OKC:(m==="X"?DANG:"#B8C0BA")}}>{m==="O"?"O":(m==="X"?"X":"·")}</td>)}
            <td style={{padding:"9px 11px",textAlign:"center",fontWeight:700}}>{r.correct}/{r.gradable}</td>
            <td style={{padding:"9px 11px",fontSize:12,color:INK}}>{Object.keys(r.mcHeld).length?Object.keys(r.mcHeld).map(id=>mcNameFrom(key,id)).join(", "):"—"}</td>
          </tr>)}</tbody>
        </table></div></div>
        <div style={{fontSize:12,color:MUT,marginTop:10}}>O 올바른 이해(1·2단계 모두 정답) · X 오답(2단계 이유에 오개념 반영) · · 미응답. 오개념은 2단계 '이유' 선택으로 진단됩니다.</div>
      </>}
    </div>
  );
}
function Stat({n,l,small}){return <div style={{flex:1,minWidth:120,background:"#fff",border:"1px solid "+LINE,borderRadius:12,padding:"14px 16px"}}><div style={{fontFamily:"monospace",fontSize:small?15:24,fontWeight:800,color:GR,lineHeight:1.2,paddingTop:small?4:0}}>{n}</div><div style={{fontSize:12.5,color:MUT,marginTop:5}}>{l}</div></div>;}

/* ══════════ 학생 페이지 ══════════ */
function StudentPage({quiz}){
  const ownerUid=quiz._ownerUid;
  const [sid,setSid]=useState(""),[confirmed,setConfirmed]=useState("");
  const [sel,setSel]=useState({}),[busy,setBusy]=useState(false),[err,setErr]=useState(""),[done,setDone]=useState(false);

  const start=async()=>{const s=(sid||"").replace(/\s+/g,"");if(!s)return;
    try{if(firebase.auth&&!firebase.auth().currentUser)await firebase.auth().signInAnonymously();}catch(e){console.error("anon",e);}
    setConfirmed(s);
    const rs=await DB.getResults(ownerUid,quiz.id);const ex=rs.find(r=>r.studentId===s);
    if(ex){setDone(!!ex.submittedAt);const m={};(ex.answers||[]).forEach(a=>{m[a.qIndex]={t1:a.selectedIndex,t2:a.reasonIndex};});setSel(m);}
  };
  const pick=(qi,tier,oi)=>setSel(p=>({...p,[qi]:{...(p[qi]||{}),[tier]:oi}}));
  const submit=async()=>{
    setErr("");setBusy(true);
    const answers=(quiz.questions||[]).map((it,i)=>{const s=sel[i]||{};return {qIndex:i,type:it.type,selectedIndex:(s.t1!=null?s.t1:-1),reasonIndex:(s.t2!=null?s.t2:-1)};});
    try{await DB.setResult(ownerUid,quiz.id,{studentId:confirmed,answers,submittedAt:now()});setDone(true);window.scrollTo(0,0);}
    catch(e){setErr("제출 실패: "+e.message);}
    setBusy(false);
  };

  if(!confirmed)return(
    <Center><div style={{background:"#fff",borderRadius:20,padding:32,width:340,boxShadow:"0 16px 48px rgba(16,52,34,.15)",textAlign:"center"}}>
      <div style={{fontSize:38,marginBottom:8}}>🧠</div>
      <div style={{fontWeight:800,fontSize:15,color:INK,marginBottom:2}}>{quiz.title}</div>
      {quiz.topic&&<div style={{fontSize:12,color:MUT,marginBottom:18}}>🧪 {quiz.topic}</div>}
      <label style={{display:"block",textAlign:"left",...lab}}>학번 (학년-반-번호)</label>
      <input value={sid} onChange={e=>setSid(e.target.value)} onKeyDown={e=>e.key==="Enter"&&start()} placeholder="예: 2-3-15" autoFocus style={{...inp,fontSize:17,textAlign:"center",fontWeight:700,padding:12}}/>
      <button onClick={start} style={btn(GR,"#fff",{width:"100%",marginTop:10,padding:12})}>시작하기</button>
    </div></Center>
  );

  if(done)return(
    <Center><div style={{background:"#fff",borderRadius:20,padding:38,width:360,boxShadow:"0 16px 48px rgba(16,52,34,.15)",textAlign:"center"}}>
      <div style={{width:56,height:56,borderRadius:"50%",background:"#E5F2EB",color:OKC,display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:28,marginBottom:12}}>✓</div>
      <h2 style={{fontSize:20,fontWeight:800,marginBottom:6}}>제출 완료</h2>
      <p style={{color:MUT,fontSize:13,marginBottom:16}}>학번 <b>{confirmed}</b> · {(quiz.questions||[]).length}문항 제출됨</p>
      <button onClick={()=>setDone(false)} style={btn("#fff",GR,{border:"1px solid "+SAGEL,width:"100%",padding:11})}>다시 풀기 / 수정 제출</button>
    </div></Center>
  );

  return(
    <div style={{minHeight:"100vh",background:PAPER}}>
      <header style={{background:GR,color:"#fff",padding:"12px 16px"}}>
        <div style={{maxWidth:720,margin:"0 auto",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div><div style={{fontWeight:900,fontSize:15}}>{quiz.title}</div><div style={{fontSize:11,opacity:.8}}>{quiz.topic}</div></div>
          <div style={{fontSize:12,opacity:.85}}>👤 {confirmed}</div>
        </div>
      </header>
      <div style={{maxWidth:720,margin:"0 auto",padding:"18px 16px 60px"}}>
        {(quiz.questions||[]).map((it,i)=>(
          <div key={i} style={card}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}><span style={{fontFamily:"monospace",fontWeight:700,color:"#fff",background:GR,width:26,height:26,borderRadius:7,display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:13}}>{i+1}</span><Badge bg={PURW} col={PUR}>이단계형</Badge></div>
            <div style={{fontFamily:"monospace",fontSize:11,fontWeight:700,color:GR,marginBottom:3}}>1단계 · 어떻게 될까요?</div>
            <div style={{fontWeight:500,marginBottom:2,whiteSpace:"pre-wrap"}}>{it.question}</div>
            {(it.options||[]).map((o,oi)=>{const on=(sel[i]||{}).t1===oi;return <div key={oi} onClick={()=>pick(i,"t1",oi)} style={{padding:"10px 12px",border:"1.5px solid "+(on?GR:LINE),background:on?SAGE:"#fff",borderRadius:10,marginTop:8,cursor:"pointer",fontSize:14.5}}>{o}</div>;})}
            <div style={{fontFamily:"monospace",fontSize:11,fontWeight:700,color:PUR,margin:"14px 0 3px"}}>2단계 · 그렇게 생각한 이유는?</div>
            <div style={{fontWeight:500,marginBottom:2}}>{it.reasonPrompt}</div>
            {(it.reasons||[]).map((o,oi)=>{const on=(sel[i]||{}).t2===oi;return <div key={oi} onClick={()=>pick(i,"t2",oi)} style={{padding:"10px 12px",border:"1.5px solid "+(on?PUR:LINE),background:on?PURW:"#fff",borderRadius:10,marginTop:8,cursor:"pointer",fontSize:14.5}}>{o}</div>;})}
          </div>
        ))}
        <Err msg={err}/>
        <button onClick={submit} disabled={busy} style={btn("#059669","#fff",{width:"100%",padding:14,fontSize:15,marginTop:4})}>{busy?<Loading label="제출 중…"/>:"제출하기"}</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
